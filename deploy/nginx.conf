server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

  # Der Offline-Speicher und die Startseite dürfen nie veraltet aus dem Zwischenspeicher kommen
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; default_type application/manifest+json; }

  # Dateien mit Hash im Namen ändern sich nie
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

  location / { try_files $uri $uri/ /index.html; }
}
